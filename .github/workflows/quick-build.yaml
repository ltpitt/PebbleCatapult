name: quick-build
run-name: "Quick debug build (${{ github.ref_name }})"
on:
  workflow_dispatch:
concurrency:
  group: quick-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-debug-apk:
    runs-on: "ubuntu-latest"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true
          submodules: recursive
          fetch-depth: 0
      - name: Globally enable build cache and parallel execution
        run: |
          mkdir -p ~/.gradle

          cat >> ~/.gradle/gradle.properties<< EOF
          org.gradle.caching=true
          org.gradle.parallel=true
          EOF
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '21'
          distribution: temurin
          cache: gradle
      - uses: android-actions/setup-android@7c5672355aaa8fde5f97a91aa9a99616d1ace6bc
      - name: Enable Gradle remote build cache
        uses: burrunan/gradle-cache-action@663fbad34e03c8f12b27f4999ac46e3d90f87eca
        with:
          debug: false
          concurrent: true
          read-only: true
          build-root-directory: mobile

      # Build only the debug APK. No lint, no tests, no screenshot tests,
      # no watchapp build, no versioning/tagging, no GitHub Release. This is
      # meant to give a quick installable APK to try on a phone, not a
      # release candidate. Use the "develop-build" workflow for a proper,
      # fully-tested and signed release.
      - name: Assemble debug APK
        run: "./gradlew :app:assembleDebug"
        working-directory: mobile

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: catapult-mobile-debug-apk
          path: mobile/app/build/outputs/apk/debug/catapult-mobile.apk
          retention-days: 14
